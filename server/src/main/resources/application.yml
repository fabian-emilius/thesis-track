spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/thesis_management
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

gdpr:
  retention:
    years: 10  # Number of years before data deletion
  notification:
    days: 30   # Number of days before deletion to send notification

upload:
  base-path: /uploads  # Base path for file uploads
