<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Thesis Presentation Scheduled</title>
</head>
<body>
    <div th:replace="~{fragments/salutation :: salutation}"></div>

    <p>A presentation has been scheduled for the thesis:</p>
    <h2 th:text="${thesis.title}"></h2>

    <div>
        <p><strong>Date:</strong> <span th:text="${#temporals.format(presentation.scheduledAt, 'dd.MM.yyyy HH:mm')}"></span></p>
        <p><strong>Location:</strong> <span th:text="${presentation.location}"></span></p>
        <p th:if="${presentation.notes}" th:text="${presentation.notes}"></p>
    </div>

    <div th:replace="~{fragments/thesis-link :: thesis-link}"></div>

    <div th:if="${group}">
        <p>This presentation is organized by <span th:text="${group.name}"></span>.</p>
        <p th:if="${group.externalLink}">For more information, visit: <a th:href="${group.externalLink}" th:text="${group.externalLink}"></a></p>
    </div>

    <div th:replace="~{fragments/notification-settings :: settings}"></div>

    <div th:replace="~{fragments/group-content :: email-footer}"></div>
</body>
</html>
